<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VORTEX V5 | تماشا</title>
<style>body{margin:0;background:#07080c;color:#fff;font-family:Tahoma,Arial}.nav{height:70px;padding:0 5%;display:flex;align-items:center}.logo{font-size:28px;font-weight:900}.logo b{color:#e50914}.back{margin-right:auto;color:#aaa}.wrap{max-width:1250px;margin:auto;padding:20px 4% 80px}.player{background:#000;border-radius:24px;overflow:hidden;box-shadow:0 25px 70px #000b}.player video{display:block;width:100%;max-height:70vh}.info{padding:22px 5px}.title{font-size:32px;margin:10px 0}.pill{display:inline-block;background:#171a22;padding:7px 12px;border-radius:99px;color:#bbb;font-size:12px;margin-left:5px}.desc{color:#aaa;line-height:2}.rate,.comments{background:#12141a;border:1px solid #242731;border-radius:18px;padding:20px;margin-top:20px}.stars span{font-size:28px;cursor:pointer;color:#666}.stars span.on{color:#ffd54a}.comment{border-top:1px solid #252832;padding:14px 0;color:#ddd}.verified{color:#29a9ff}.commentInput{display:flex;gap:10px}.commentInput input{flex:1;background:#090a0e;border:1px solid #30333d;color:#fff;padding:12px;border-radius:9px}.commentInput button{background:#e50914;border:0;color:#fff;border-radius:9px;padding:0 18px}</style></head><body>
<div class="nav"><div class="logo">VOR<b>TEX</b></div><a class="back" href="/">← بازگشت</a></div><main class="wrap"><div class="player"><video id="video" controls controlsList="nodownload" disablePictureInPicture></video></div><div class="info"><div id="meta"></div><h1 class="title" id="title"></h1><p class="desc" id="desc"></p><p id="creator"></p></div><section class="rate"><h3>⭐ امتیاز فیلم</h3><div class="stars" id="stars">★★★★★</div><small id="rateText" style="color:#999"></small></section><section class="comments"><h3>💬 نظرات</h3><div class="commentInput"><input id="comment" placeholder="نظر خودت را بنویس..."><button onclick="addComment()">ارسال</button></div><div id="comments"></div></section></main>
<script>
const id=new URLSearchParams(location.search).get('id');let movie;
async function load(){let ms=await(await fetch('/api/movies')).json();movie=ms.find(x=>x.id===id);if(!movie)return;title.textContent=movie.name;desc.textContent=movie.description||'';creator.textContent='🎬 سازنده / ثبت‌کننده: '+(movie.creator||'NOVAFLIX');meta.innerHTML='<span class="pill">'+(movie.category||'سایر')+'</span><span class="pill">⭐ '+(movie.rating||0)+'</span>';video.src=movie.video; if(movie.subtitle){let t=document.createElement('track');t.kind='subtitles';t.label='زیرنویس';t.srclang='fa';t.src=movie.subtitle;t.default=true;video.appendChild(t)}loadComments();document.querySelectorAll('.stars span').forEach((x,i)=>x.onclick=()=>rate(i+1));}
stars.innerHTML=[1,2,3,4,5].map(i=>`<span data-i="${i}">★</span>`).join('');
async function rate(score){let r=await fetch('/api/movies/'+id+'/rating',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score})}),d=await r.json();if(!d.ok){rateText.textContent='❌ '+d.error;return}document.querySelectorAll('.stars span').forEach((x,i)=>x.classList.toggle('on',i<score));rateText.textContent='امتیاز شما ثبت شد.';load()}
async function loadComments(){let cs=await(await fetch('/api/movies/'+id+'/comments')).json();comments.innerHTML=cs.map(c=>`<div class="comment"><b>${esc(c.name)} ${c.verified?'<span class="verified">✓</span>':''}</b><div>${esc(c.text)}</div></div>`).join('')||'<p style="color:#777">هنوز نظری ثبت نشده.</p>'}
async function addComment(){let text=comment.value.trim();if(!text)return;let r=await fetch('/api/movies/'+id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}),d=await r.json();if(!d.ok){alert(d.error);return}comment.value='';loadComments()}
function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}load();
</script></body></html>

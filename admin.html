<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVAFLIX Admin</title><style>
body{margin:0;background:#08090d;color:#fff;font-family:Tahoma,Arial}.wrap{max-width:1100px;margin:30px auto;padding:20px}.box,.movie{background:#12141a;border:1px solid #252832;border-radius:18px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,textarea,select{width:100%;padding:12px;background:#090a0e;color:#fff;border:1px solid #30333d;border-radius:9px;box-sizing:border-box}.full{grid-column:1/-1}button{width:100%;padding:12px;margin-top:12px;border:0;border-radius:9px;background:#e50914;color:#fff;font-weight:bold}.movies{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.movie{padding:0;overflow:hidden}.movie img{width:100%;height:260px;object-fit:cover}.movie div{padding:12px}.del{background:#94192b}.brand{font-size:28px;font-weight:900}.brand b{color:#e50914}</style></head><body><main class="wrap"><div class="brand">VOR<b>TEX</b> ADMIN ✓</div><div class="box"><h2>افزودن فیلم</h2><div class="grid"><div><label>نام</label><input id="name"></div><div><label>سازنده فیلم</label><input id="creator" placeholder="نام سازنده / استودیو"></div><div><label>دسته‌بندی</label><select id="category"><option>اکشن</option><option>کمدی</option><option>درام</option><option>علمی‌تخیلی</option><option>ترسناک</option><option>ماجراجویی</option><option>انیمیشن</option><option>خانوادگی</option><option>مارول</option><option>سایر</option></select></div><div><label>پوستر</label><input id="poster" type="file" accept="image/*"></div><div><label>فیلم</label><input id="video" type="file" accept="video/*"></div><div><label>زیرنویس دستی VTT</label><input id="subtitle" type="file" accept=".vtt"></div><div class="full"><label>توضیحات</label><textarea id="description"></textarea></div></div><button onclick="add()">➕ افزودن فیلم</button><p id="status" style="color:#aaa"></p></div><h2>فیلم‌ها و آمار</h2><div class="movies" id="list"></div></main>
<script>
async function add(){let f=new FormData();const n=document.getElementById('name'), cr=document.getElementById('creator'), cat=document.getElementById('category'), de=document.getElementById('description'), po=document.getElementById('poster'), vi=document.getElementById('video'), su=document.getElementById('subtitle');
let f=new FormData();f.append('name',n.value);f.append('creator',cr.value);f.append('category',cat.value);f.append('description',de.value);if(po.files[0])f.append('poster',po.files[0]);if(vi.files[0])f.append('video',vi.files[0]);if(su.files[0])f.append('subtitle',su.files[0]);status.textContent='در حال آپلود...';let r=await fetch('/api/movies',{method:'POST',body:f}),d=await r.json();status.textContent=d.ok?'✅ ذخیره شد.':'❌ '+d.error;if(d.ok){n.value='';cr.value='';de.value='';po.value='';vi.value='';su.value='';load()}}
async function load(){let ms=await(await fetch('/api/movies')).json();list.innerHTML=ms.slice().reverse().map(m=>`<article class="movie"><img src="${m.poster}"><div><b>${esc(m.name)}</b><p style="color:#aaa">🎬 ${esc(m.creator||'NOVAFLIX')}<br>⭐ ${m.rating||0} · 👍 ${m.likes||0} · 💬 ${m.comments||0}</p><button class="del" onclick="del('${m.id}')">حذف</button></div></article>`).join('')||'<p>فیلمی نیست.</p>'}
async function del(id){if(confirm('حذف شود؟')){await fetch('/api/movies/'+id,{method:'DELETE'});load()}}function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}load();
</script></body></html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORTEX V5 — سینمای آنلاین</title><style>
*{box-sizing:border-box}body{margin:0;background:#07080c;color:#fff;font-family:Tahoma,Arial}.nav{height:70px;position:fixed;z-index:50;top:0;width:100%;padding:0 5%;display:flex;align-items:center;gap:25px;background:linear-gradient(#07080cf2,transparent)}.logo{font-size:29px;font-weight:900}.logo b{color:#e50914}a{color:#ddd;text-decoration:none}nav a{margin:0 9px;font-size:14px}.search{margin-right:auto;background:#ffffff12;border:1px solid #ffffff18;color:#fff;padding:10px 14px;border-radius:10px;width:220px}.account{background:#e50914;padding:10px 16px;border-radius:9px;color:#fff;font-size:13px}
.hero{height:650px;position:relative;overflow:hidden}.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s;background-position:center;background-size:cover}.slide.active{opacity:1}.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#07080c 5%,#07080c8c 48%,transparent),linear-gradient(0deg,#07080c,transparent 60%)}.heroText{position:absolute;z-index:2;right:5%;bottom:80px;max-width:650px}.heroText h1{font-size:clamp(40px,5vw,70px);margin:12px 0}.heroText p{color:#ddd;line-height:2}.dots{position:absolute;z-index:4;bottom:30px;right:5%}.dot{display:inline-block;width:8px;height:8px;background:#777;border-radius:50%;margin:4px}.dot.on{background:#e50914;width:25px;border-radius:9px}
.wrap{max-width:1450px;margin:auto;padding:25px 4% 80px}.section{margin:20px 0 42px}.row{display:flex;gap:18px;overflow-x:auto;padding:8px 2px 18px}.row::-webkit-scrollbar{height:5px}.row::-webkit-scrollbar-thumb{background:#333;border-radius:9px}.card{flex:0 0 205px;background:#11131a;border-radius:14px;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-6px) scale(1.03)}.card img{width:100%;height:290px;object-fit:cover}.info{padding:12px}.info h3{font-size:15px;margin:0 0 7px}.meta{font-size:11px;color:#999}.watch{display:block;background:#242730;text-align:center;padding:9px;border-radius:8px;margin-top:10px}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{padding:8px 13px;border:1px solid #292c35;border-radius:99px;color:#aaa;cursor:pointer}.chip.on{background:#e50914;color:#fff;border-color:#e50914}
.modal{display:none;position:fixed;z-index:100;inset:0;background:#000b;align-items:center;justify-content:center}.modal.show{display:flex}.box{width:min(430px,92%);background:#15171e;border:1px solid #2b2e38;border-radius:20px;padding:25px}.box input{width:100%;padding:12px;margin:7px 0;background:#090a0e;color:#fff;border:1px solid #30333d;border-radius:9px}.box button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:9px;background:#e50914;color:#fff;font-weight:bold}.muted{color:#999;font-size:12px}.close{float:left;cursor:pointer;color:#aaa}
</style></head><body>
<header class="nav"><div class="logo">VOR<b>TEX</b></div><nav><a href="#">خانه</a><a href="#movies">فیلم‌ها</a><a href="#cats">دسته‌بندی</a></nav><input id="search" class="search" placeholder="جستجوی فیلم..."><a class="account" href="#" onclick="openAuth();return false" id="account">ورود / ثبت‌نام</a></header>
<section class="hero"><div id="slides"></div><div class="dots" id="dots"></div></section>
<main class="wrap" id="movies"><section class="section"><h2>🔥 جدیدترین فیلم‌ها</h2><div class="row" id="latest"></div></section>
<section class="section"><h2>⭐ محبوب‌ترین‌ها</h2><div class="row" id="popular"></div></section>
<section class="section" id="cats"><h2>🎭 دسته‌بندی‌ها</h2><div class="chips" id="chips"></div><div class="row" id="catrow"></div></section></main>
<div class="modal" id="modal"><div class="box"><span class="close" onclick="closeAuth()">✕</span><h2 id="authTitle">ورود به VORTEX V5</h2><div id="authForm"><input id="authName" placeholder="نام" style="display:none"><input id="authEmail" placeholder="ایمیل"><input id="authPass" type="password" placeholder="رمز عبور"><button onclick="submitAuth()">ورود</button><p class="muted" id="switch" onclick="toggleAuth()" style="cursor:pointer">حساب نداری؟ ثبت‌نام کن</p><p id="authMsg" class="muted"></p></div></div></div>
<script>
let ms=[],cat=null,loginMode=true,slide=0;
const $=x=>document.getElementById(x);
async function load(){ms=await(await fetch('/api/movies')).json();render();hero();me()}
function card(m){return `<article class="card"><img src="${m.poster}"><div class="info"><h3>${esc(m.name)}</h3><div class="meta">⭐ ${m.rating||0} · ${esc(m.category||'سایر')}</div><a class="watch" href="/watch.html?id=${m.id}">▶ تماشا</a></div></article>`}
function render(){let q=$('search').value.toLowerCase(),a=ms.filter(m=>(!q||m.name.toLowerCase().includes(q))&&(!cat||m.category===cat));$('latest').innerHTML=a.slice().reverse().map(card).join('')||'<p class="muted">فیلمی نیست.</p>';$('popular').innerHTML=a.slice().sort((x,y)=>(y.rating||0)-(x.rating||0)).map(card).join('')||'<p class="muted">فیلمی نیست.</p>';let cs=[...new Set(ms.map(m=>m.category||'سایر'))];$('chips').innerHTML='<span class="chip '+(!cat?'on':'')+'" onclick="setCat(null)">همه</span>'+cs.map(c=>`<span class="chip ${cat===c?'on':''}" onclick="setCat('${c.replaceAll("'","\\'")}')">${esc(c)}</span>`).join('');$('catrow').innerHTML=a.map(card).join('')}
function setCat(c){cat=c;render()}$('search').oninput=render;
function hero(){let a=ms.slice().reverse().slice(0,5);$('slides').innerHTML=a.map((m,i)=>`<div class="slide ${i===0?'active':''}" style="background-image:url('${m.poster}')"><div class="heroText"><small>${esc(m.category||'فیلم')}</small><h1>${esc(m.name)}</h1><p>${esc(m.description||'')}</p><a class="account" href="/watch.html?id=${m.id}">▶ تماشا</a></div></div>`).join('');$('dots').innerHTML=a.map((_,i)=>`<i class="dot ${i===0?'on':''}"></i>`).join('');if(a.length>1)setInterval(()=>{let ss=document.querySelectorAll('.slide'),ds=document.querySelectorAll('.dot');ss[slide]?.classList.remove('active');ds[slide]?.classList.remove('on');slide=(slide+1)%ss.length;ss[slide]?.classList.add('active');ds[slide]?.classList.add('on')},5000)}
async function me(){let d=await(await fetch('/api/me')).json();if(d.logged_in)$('account').textContent=d.user.name+(d.user.verified?' ✓':'')}
function openAuth(){$('modal').classList.add('show')}function closeAuth(){$('modal').classList.remove('show')}function toggleAuth(){loginMode=!loginMode;$('authTitle').textContent=loginMode?'ورود به VORTEX V5':'ساخت حساب در VORTEX V5';$('authName').style.display=loginMode?'none':'block';$('authForm button').textContent=loginMode?'ورود':'ساخت حساب';$('switch').textContent=loginMode?'حساب نداری؟ ثبت‌نام کن':'حساب داری؟ وارد شو'}
async function submitAuth(){let body={name:$('authName').value,email:$('authEmail').value,password:$('authPass').value},r=await fetch(loginMode?'/api/login':'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();$('authMsg').textContent=d.ok?'✅ انجام شد.':('❌ '+d.error);if(d.ok){closeAuth();me();if(d.user.admin)location.href='/admin.html'}}
function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}load();
</script></body></html>
